# OBCS-Nifty — full stack via Docker Compose.
#
# Services:
#   db        Supabase Postgres (auth schema, RLS, realtime publication)
#   kong      API gateway exposing the Supabase REST/Auth/Realtime API on :8000
#   auth      GoTrue (Supabase Auth) — issues the JWTs the backend verifies
#   rest      PostgREST — table access for the UI (read-only via RLS)
#   realtime  Realtime — streams trades/strategy_state changes to the UI
#   meta      postgres-meta (used by studio)
#   studio    Supabase Studio admin UI (optional; `--profile studio`)
#   backend   Go/Gin API + strategy runner (single writer)
#   frontend  Nuxt SPA
#
# Copy .env.example to .env and edit before `docker compose up -d`.

name: obcs-nifty

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/volumes/db/99-obcs-init.sh:/docker-entrypoint-initdb.d/z-obcs-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    image: supabase/realtime:v2.30.34
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  meta:
    image: supabase/postgres-meta:v0.83.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    volumes:
      - ./supabase/volumes/kong/kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 5s
      timeout: 5s
      retries: 10

  studio:
    image: supabase/studio:20240729-ce42139
    restart: unless-stopped
    profiles: ["studio"]
    depends_on:
      - meta
    ports:
      - "3001:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  backend:
    build:
      context: ./OBCS-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-http://kong:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      TRADING_MODE: ${TRADING_MODE:-paper}
      AO_API_KEY: ${AO_API_KEY:-}
      AO_CLIENT_CODE: ${AO_CLIENT_CODE:-}
      AO_MPIN: ${AO_MPIN:-}
      AO_TOTP_SECRET: ${AO_TOTP_SECRET:-}
      AO_BASE_URL: ${AO_BASE_URL:-https://apiconnect.angelone.in}
      STRAT_UNDERLYING: ${STRAT_UNDERLYING:-NIFTY}
      STRAT_LOT_SIZE: ${STRAT_LOT_SIZE:-65}
      STRAT_LOTS: ${STRAT_LOTS:-2}
      STRAT_STRIKE_STEP: ${STRAT_STRIKE_STEP:-50}
      STRAT_STRIKE_DIST_PCT: ${STRAT_STRIKE_DIST_PCT:-1.0}
      STRAT_DTE_TARGET: ${STRAT_DTE_TARGET:-14}
      STRAT_INITIAL_CAPITAL: ${STRAT_INITIAL_CAPITAL:-200000}
      STRAT_USE_EMA: ${STRAT_USE_EMA:-false}
      STRAT_USE_AGC: ${STRAT_USE_AGC:-false}
      STRAT_ENABLE_COSTS: ${STRAT_ENABLE_COSTS:-true}
      STRAT_ENTRY_TIME: ${STRAT_ENTRY_TIME:-15:20}
      STRAT_EXIT_TIME: ${STRAT_EXIT_TIME:-09:20}

  frontend:
    build:
      context: ./OBCS-frontend
      args:
        # Public values baked into the client bundle at build time.
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
        SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
        SUPABASE_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_KEY: ${ANON_KEY}

volumes:
  db-data:
